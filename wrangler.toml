name = "elgranjero"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# Variables opcionales (también se pueden cargar desde el panel de Cloudflare Pages)
# [vars]
# SFL_API_BASE = "https://api.sunflower-land.com"
# SFL_FARM_PATH = "/community/farms/{id}"
# PRICES_URL = "https://sfl.world/api/v1/prices"
# FLOWER_TOKEN = "0x3e12b9d6a4d12cd9b4a6d613872d0eb32f68b380"
# La API key, si hace falta, cargala como secreto:  npx wrangler pages secret put SFL_API_KEY

# Base D1 compartida con el Worker programado (historial).
# Pegá el mismo database_id que en worker/wrangler.toml.
# Importante: con este archivo en el repo, Cloudflare toma los bindings de acá y no del panel.
[[d1_databases]]
binding = "DB"
database_name = "dongranjero"
database_id = "8467dfee-6d91-4d8d-a389-2e14641a6deb"
